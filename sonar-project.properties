# Analyse SonarQube Cloud, lancée par le job "sonar" de .github/workflows/pipeline.yml
sonar.organization=fepalcho
sonar.projectKey=fepalcho_job-tracker
sonar.projectName=job-tracker

# Code applicatif
sonar.sources=backend-nestjs/src,frontend/src,scripts
# Le scanner 8 indexe tout le dépôt : inclusions explicites pour s'en tenir au code applicatif.
sonar.inclusions=backend-nestjs/src/**,frontend/src/**,scripts/**
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Tests (unitaires de l'API et e2e Cypress)
sonar.tests=backend-nestjs/src,backend-nestjs/test,e2e/cypress
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,e2e/cypress/**/*.ts

# Couverture des tests unitaires de l'API (Vitest, format lcov).
# Même périmètre que vitest.config.ts : le front est couvert par les tests e2e,
# qui ne produisent pas de rapport de couverture.
sonar.javascript.lcov.reportPaths=backend-nestjs/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,scripts/**,backend-nestjs/src/main.ts,backend-nestjs/src/app.*.ts,**/*.module.ts

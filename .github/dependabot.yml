version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /backend-nestjs
      - /frontend
      - /e2e
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # vitest et ses modules (@vitest/coverage-v8…) doivent rester à la même version.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      mineures-et-correctifs:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
